<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="brand__mark" src="{{ '/assets/images/icons/logo-white.svg' | relative_url }}" alt="" width="22" height="33">
        <span class="brand__name">Obvious Ridge Route</span>
      </a>
      <p class="site-footer__note">{{ site.tagline }}. {{ site.location }}.</p>
    </div>
    <nav aria-label="Footer">
      <ul class="site-footer__links">
        {%- for item in site.data.navigation %}
        <li><a href="{{ item.href | relative_url }}">{{ item.label }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <div class="site-footer__contact">
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <p>&copy; {{ site.time | date: '%Y' }} Obvious Ridge Route</p>
    </div>
  </div>
</footer>
