faq_title: Questions about agentic AI development
faq:
  - question: What is agentic AI development?
    answer: It is the work of building AI agents that carry out multi-step tasks on their own. An agent reads source material, decides the next step, uses the tools and systems it is connected to, and returns a finished result for a person to review.
  - question: How is an AI agent different from a chatbot?
    answer: A chatbot answers questions in a conversation. An agent runs a job. It reads a spec book or a mailbox, extracts what matters, drafts a deliverable such as a bid scope or a report, checks it against the source, and saves the file where your team works.
  - question: What kind of work suits an agent?
    answer: Repetitive, document-heavy work with a clear finished product, such as bid scopes, RFP responses, submittal reviews, schedules, safety audits, and reports. If a task has several steps and an expert can describe what done looks like, it is a good candidate for a pipeline.
  - question: What systems can the agents connect to?
    answer: The agents we built for SiteSpecs AI work inside the Site Specs platform, Microsoft SharePoint, and Outlook, and run sourced research on the live web. On a new project we connect them to the systems your team already uses.
  - question: How do you protect our proprietary data?
    answer: Every agent runs inside a secure harness we build, on AI models that protect a company’s proprietary data. Each company’s knowledge base, including what its agents learn, is siloed to that company and its users.
  - question: What is an agent harness?
    answer: A harness is the software around an AI model that turns it into an agent. It gives the agent its documents and tools, runs each step of the pipeline, checks the result against the source, and hands it off. We build ours for enterprise security.
  - question: What do the agents produce?
    answer: Standard files your team can open anywhere, including Word documents, Excel workbooks, PDFs, Primavera P6 schedules, and Microsoft Project files.
  - question: How does a project start?
    answer: With a conversation about the work and the documents behind it. We then design and build the agents with your team in short steps you can review, launch them, and stay available to extend them.
  - question: Who is Obvious Ridge Route?
    answer: Obvious Ridge Route is a software studio in Chicago, Illinois, founded in 2013 by Mike Reilly. It designs and builds secure agentic AI systems and production software, and works with teams remotely.
