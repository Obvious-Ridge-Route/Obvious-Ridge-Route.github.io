security:
  - title: Secure agent harnesses
    body: "Each agent runs inside a harness we build for enterprise security: the software around the model that supplies its documents and tools and runs each step."
  - title: Proprietary data protected
    body: Agents run on AI models that protect a company’s proprietary data, from the documents they read to the deliverables they produce.
