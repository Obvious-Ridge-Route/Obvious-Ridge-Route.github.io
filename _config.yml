# Site settings. Restart `jekyll serve` after editing this file.

title: Obvious Ridge Route
tagline: Agentic AI and software development
description: Obvious Ridge Route designs and builds production software and agentic AI systems for operating businesses.
url: "https://obviousridgeroute.com"
baseurl: ""
repository: Obvious-Ridge-Route/Obvious-Ridge-Route.github.io
lang: en-US

email: mike@obviousridgeroute.com
location: Chicago, Illinois

# Paste the form id from formspree.io (the part after /f/) to turn on the
# homepage contact form. Leave empty to show only the email link.
formspree_id: ""

social_image: /assets/images/ridge-1280.jpg

# GitHub Pages applies its Primer theme unless a theme is set. Primer ships its
# own assets/css/style.css, so the theme stays explicitly off.
theme: null

plugins:
  - jekyll-sitemap

# GitHub Pages renders Markdown files without front matter, so everything that
# is not part of the website is listed here.
exclude:
  - README.md
  - AGENTS.md
  - CHANGELOG.md
  - package.json
  - package-lock.json
  - postcss.config.cjs
  - tailwind.config.cjs
  - node_modules
  - src
  - tests
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
