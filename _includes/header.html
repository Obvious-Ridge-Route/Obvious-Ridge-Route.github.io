<header class="site-header" data-header>
  <div class="site-header__bar glass">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__mark" src="{{ '/assets/images/icons/logo-white.svg' | relative_url }}" alt="" width="22" height="33">
      <span class="brand__name">Obvious Ridge Route</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        {%- for item in site.data.navigation %}
        <li><a href="{{ item.href | relative_url }}">{{ item.label }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <a class="btn btn--primary btn--sm sheen site-header__cta" href="{{ '/#contact' | relative_url }}">Start a project</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-toggle>
      <span class="menu-toggle__icon" aria-hidden="true"></span>
      Menu
    </button>
  </div>
  <nav class="site-menu glass" id="site-menu" aria-label="Menu" hidden data-menu>
    <ul>
      {%- for item in site.data.navigation %}
      <li><a href="{{ item.href | relative_url }}">{{ item.label }}</a></li>
      {%- endfor %}
    </ul>
  </nav>
</header>
