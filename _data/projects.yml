# Every project on the site, in display order.
# Projects with `featured: true` (three or four, agentic AI work first) are the
# large cards on the homepage; the rest appear under "More work". Each id needs
# a page at <id>.html with `layout: project` and `project: <id>`, and an
# og.jpg link preview beside its images. README.md walks through adding one.
#
# `link` is the live site. Before a site launches, use `launch_url` instead:
# the case study then says "Launching at <domain>" without linking anywhere.
# `seo_title` (before " | Obvious Ridge Route") and `seo_description` are optional.

- id: sitespecs-ai
  featured: true
  title: SiteSpecs AI
  seo_title: "SiteSpecs AI: Agentic AI for Construction"
  category: Agentic AI · Construction
  summary: Expert AI agents and multi-step pipelines that read a contractor’s documents and return finished bid scopes, RFP responses, schedules, and safety audits.
  intro: SiteSpecs AI gives construction companies expert agents trained on their own documents, data, and preferred websites. Each agent runs multi-step pipelines that read a full spec book, extract the work, and hand back a deliverable the team can send.
  role: We designed and built SiteSpecs AI, including the agents, the pipelines that chain their steps, the integrations they work through, and the exports that land in the tools crews already use.
  link: https://ai.sitespecs.io/
  card:
    src: /assets/images/projects/sitespecs-ai/card.webp
    alt: SiteSpecs AI homepage with the headline “Put an expert AI agent on every crew” and status cards for bid scope, RFP, and safety agents
  hero:
    src: /assets/images/projects/sitespecs-ai/hero.webp
    alt: SiteSpecs AI homepage showing pipeline status cards for a bid scope, an RFP response, and an OSHA site audit
  overview:
    src: /assets/images/projects/sitespecs-ai/overview.webp
    alt: Diagram of a company’s documents, data, and websites training a SiteSpecs expert agent
  delivered:
    - Expert agents trained on each company’s documents, data, and preferred websites
    - Twelve pipelines, including bid scope, submittal review, schedule of values, CPM schedule, RFP response, and safety audit
    - Integrations with the Site Specs platform, Microsoft SharePoint, and Outlook, plus sourced web research
    - Exports to Word, Excel, PDF, Primavera P6, and Microsoft Project
  design:
    src: /assets/images/projects/sitespecs-ai/design.webp
    alt: "SiteSpecs AI pipeline in five steps: read the documents, extract the scope, build the bid scope, review and verify, deliver"

- id: sitespecs
  featured: true
  title: Site Specs
  seo_title: "Site Specs: Construction Management Platform"
  category: Construction project management
  summary: A construction management platform for field and office teams, with photos, checklists, submittals, RFIs, contracts, and accounting in one project record.
  intro: Site Specs is a cloud platform and mobile app for general contractors, subcontractors, and property managers. Crews capture photos, checklists, and daily reports in the field while the office runs submittals, RFIs, contracts, and accounting from the same project.
  role: We designed and built the platform across web and mobile, and have kept extending it as it grew from progress photos into full project management, used by thousands of companies on tens of thousands of projects.
  link: https://sitespecs.io/
  card:
    src: /assets/images/projects/sitespecs/card.webp
    alt: Site Specs dashboard with a project map, project totals, and billing, beside the mobile project list
  hero:
    src: /assets/images/projects/sitespecs/hero.webp
    alt: Site Specs web dashboard with a map of company projects and the mobile app’s project list
  overview:
    src: /assets/images/projects/sitespecs/overview.webp
    alt: Site Specs daily report with jobsite photos and a signature
  delivered:
    - iOS and Android apps for photos, checklists, daily reports, and documents in the field
    - Web tools for submittals, RFIs, contracts, change management, and accounting
    - A subcontractor database shared across every project
    - Integrations with Procore, Adobe Sign, Stripe, Google Vision OCR, and NOAA weather data
  gallery_title: Tools in the platform
  gallery:
    - src: /assets/images/projects/sitespecs/gallery-photos.webp
      alt: Site Specs photos tool with a grid of tagged progress photos and the mobile camera view
      caption: Photos
    - src: /assets/images/projects/sitespecs/gallery-checklists.webp
      alt: Site Specs excavation daily checklist on desktop and mobile
      caption: Checklists
    - src: /assets/images/projects/sitespecs/gallery-contracts.webp
      alt: Site Specs project contracts table with statuses and amounts
      caption: Contracts
    - src: /assets/images/projects/sitespecs/gallery-submittals.webp
      alt: Site Specs submittal record for a concrete cutting subcontractor
      caption: Submittals
    - src: /assets/images/projects/sitespecs/gallery-rfis.webp
      alt: Site Specs form for creating a request for information
      caption: RFIs
    - src: /assets/images/projects/sitespecs/gallery-accounting.webp
      alt: Site Specs voucher form and revenue summary
      caption: Accounting

- id: econ-incubator
  featured: true
  title: Kenneth C. Griffin Applied Economics Incubator
  seo_title: Griffin Applied Economics Incubator Website
  category: University of Chicago · Research website
  summary: The public website for a University of Chicago research incubator, covering its two-year research programs, topics, conferences, and calls for papers.
  intro: The Kenneth C. Griffin Applied Economics Incubator at the University of Chicago launches a two-year research program each year and convenes economists, industry experts, and students around it. Its website is where those programs, events, and calls for papers are published.
  role: We designed and built the website, with an archive of research topics, event and conference pages, calls for papers, topic search, and an email sign-up for event notices.
  link: https://econincubator.uchicago.edu/
  card:
    src: /assets/images/projects/econ-incubator/card.webp
    alt: Kenneth C. Griffin Applied Economics Incubator homepage with a University of Chicago campus photo
  hero:
    src: /assets/images/projects/econ-incubator/hero.webp
    alt: Incubator homepage with the site navigation and a University of Chicago campus photo
  overview:
    src: /assets/images/projects/econ-incubator/overview.webp
    alt: Incubator topics page with a search field and cards for Spatial Dynamics and AI in the Workplace
  delivered:
    - Topic pages for each two-year research program
    - Event, conference, and announcement listings
    - Calls for papers and contact pages
    - Topic search and an email sign-up for event notices
  built_with:
    - Qwik
    - Tailwind CSS
  design:
    src: /assets/images/projects/econ-incubator/design.webp
    alt: Incubator announcements for a student research assistantship and the AI in the Workplace conference

